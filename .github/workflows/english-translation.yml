name: Verify authoritative English Design
on:
  push:
    branches: [main, docs/english-authoritative-20261113]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  translation-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete English coverage and independently attested acceptance
        run: python3 tools/verify_english_translation.py
