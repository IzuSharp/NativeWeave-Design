name: Source-driven query feasibility
on:
  push:
    branches: [research/source-driven-integration-2026-11-12]
    paths:
      - .github/workflows/source-driven-probe.yml
      - experiments/source-driven/probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-query-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '11.0.100'
      - name: Run isolated research prototype
        run: python3 experiments/source-driven/probe.py
      - name: Preserve actual results and generated source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-driven-query-probe
          retention-days: 14
          path: |
            experiments/source-driven/evidence/
            experiments/source-driven/work/native/Cargo.toml
            experiments/source-driven/work/native/Cargo.lock
            experiments/source-driven/work/native/src/
            experiments/source-driven/work/managed/*.cs
            experiments/source-driven/work/managed/*.csproj
            experiments/source-driven/work/app/*.cs
            experiments/source-driven/work/app/*.csproj
            experiments/source-driven/work/app/NuGet.Config
            experiments/source-driven/work/feed/*.nupkg
  corrected-source-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Collect canonical SQLx and package-specific Actix tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile, urllib.request
          root=pathlib.Path('corrected-source');root.mkdir()
          targets=[('transact-rs/sqlx','v0.9.0','75bc0487eb661da811bb7a3c5d158f1bd463fef4'),('actix/actix-web','actix-web-v4.19.0','fdb6503d95228f44ba926f6347c11fd523e22193'),('actix/actix-net','actix-server-v2.10.0','f22be1d9731f764707dd3e286900d285c6f60b14')]
          records=[]
          for repo,tag,sha in targets:
              url=f'https://codeload.github.com/{repo}/tar.gz/{sha}'
              data=urllib.request.urlopen(url,timeout=120).read();dest=root/repo.replace('/','__');dest.mkdir()
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
                  for m in tf.getmembers():
                      if not m.isfile() or m.size>2000000:continue
                      rel=pathlib.PurePosixPath(*pathlib.PurePosixPath(m.name).parts[1:])
                      if not rel.parts or '..' in rel.parts:raise ValueError('unsafe path')
                      b=tf.extractfile(m).read()
                      try:b.decode('utf-8')
                      except UnicodeDecodeError:continue
                      p=dest/str(rel);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
              records.append({'repository':repo,'tag':tag,'commit':sha,'archive_url':url,'archive_sha256':hashlib.sha256(data).hexdigest()})
          (root/'corrected-pins.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'correction':'Initial latest-release collector selected unrelated monorepo tags for Actix and did not resolve SQLx repository move. These exact package tags supersede those observations; no claim of reading all downloaded files.','sources':records},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corrected-source-inputs
          path: corrected-source/
          retention-days: 14
