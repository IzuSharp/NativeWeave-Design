[package]
name = "nw-server-body-probe"
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
publish = false

[dev-dependencies]
hyper = { version = "=1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tower = { version = "=0.5.3", features = ["limit", "util"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "io-util", "time"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.cargo]
unused_dependencies = "deny"
