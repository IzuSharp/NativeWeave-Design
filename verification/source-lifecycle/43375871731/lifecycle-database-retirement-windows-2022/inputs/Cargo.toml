[package]
name = "nw-database-retirement-probe"
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
publish = false

[dev-dependencies]
sea-query = { version = "=1.0.2", default-features = false, features = ["backend-sqlite", "backend-postgres", "thread-safe"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "sync"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.cargo]
unused_dependencies = "deny"
